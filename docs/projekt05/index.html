<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Projekt 05</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
<div class="page-wrapper"><form action="http://adresserwera" id="formularz"><table>
    
<colgroup>
    <col style="width: 200px;">
    <col>
</colgroup>

<thead>
    <tr>
        <th colspan="2"><h1>Formularz</h1></th>
    </tr>
</thead>

<tbody>
    <tr>
        <!-- IMIE I NAZWISKO -->
        <td>
            <label>Imię i nazwisko*:</label>
            <label hidden for="imie">Imię*:</label>
            <lavel hidden for="nazwisko">Nazwisko*:</lavel>
        </td>
        <td>
            <input required type="text" id="imie" name="imie" placeholder="Imię"> 
            <input required type="text" id="nazwisko" name="nazwisko" placeholder="Nazwisko">
        </td>
    </tr>
    <tr>
        <!-- DATA URODZENIA -->
        <td>
            <label for="data-urodzenia">Data urodzenia*:</label>
        </td>
        <td>
            <input required type="date" id="data-urodzenia" name="data-urodzenia">
        </td>
    </tr>
    <tr>
        <!-- EMAIL -->
        <td>
            <label for="email">E-mail*:</label>
        </td>
        <td>
            <input required type="email" id="email" name="email" placeholder="name@example.com">
        </td>
    </tr>
    <tr>
        <!-- TELEFON -->
        <td><label for="telefon">Telefon*:</label></td>
        <td>
            <select required id="kod-tel-kraju" name="kod-tel-kraju">
                <option value="" selected disabled> -- </option>
                <option value="+48">🇵🇱 PL (+48)</option>
                <option value="+1">🇺🇸 US (+1)</option>
                <option value="+44">🇬🇧 UK (+44)</option>
                <option value="+49">🇩🇪 DE (+49)</option>
                <option value="+33">🇫🇷 FR (+33)</option>
                <option value="+380">🇺🇦 UA (+380)</option>
            </select> -
            <input required id="telefon" type="tel" id="telefon" name="telefon" placeholder="123 456 789" title="Format: 123 456 789, podaj tylko cyfry">
        </td>
    </tr>
    <tr>
        <!-- ULICA -->
        <td><label for="ulica">Ulica*:</label></td>
        <td> <input required type="text" id="ulica" name="ulica"></td>
    </tr>
    <tr>
        <!-- NUMER DOMU I LOKALU -->
        <td>
            <label>Nr budynku*/lokalu:</label>
            <label hidden for="nr-budynku">Nr budynku*:</label>
            <label hidden for="nr-mieszkania">Nr mieszkania:</label>
        </td>
        <td>
            <input required type="text" id="nr-budynku" name="nr-budynku" placeholder="12A">
            / <input type="number" id="nr-mieszkania" name="nr-mieszkania" placeholder="34">
        </td>
    </tr>
    <tr>
        <!-- KOD POCZTOWY -->
        <td><label for="kod-pocztowy">Kod pocztowy*:</label></td>
        <td><input required type="text" id="kod-pocztowy" name="kod-pocztowy" pattern= placeholder="00-000" title="Format: 00-000, podaj tylko cyfry"></td>
    </tr>
    <tr>
        <!-- MIASTO -->
        <td><label for="miasto">Miasto*:</label></td>
        <td><input required type="text" id="miasto" name="miasto"></td>
    </tr>
    <tr>
        <!-- WOJEWÓDZTWO -->
        <td><label for="wojewodztwo">Województwo*:</label></td>
        <td>
            <select required id="wojewodztwo" name="wojewodztwo">
                <option value="" selected disabled>- województwo -</option> 
                <option value="mazowieckie">mazowieckie</option>
                <option value="lodzkie">łódzkie</option>
                <option value="malopolskie">małopolskie</option>
                <option value="pomorskie">pomorskie</option>
            </select>
        </td>
    </tr>
    <tr>
        <!-- PRAWO JAZDY -->
        <td><label for="prawojazdy">Prawo jazdy:</label></td>
        <td><input type="checkbox" id="prawojazdy" name="prawojazdy"></td>
    </tr>
    <tr>
        <!-- HASŁO -->
        <td>
            <label for="haslo">Hasło*:</label>
        </td>
        <td>
            <input required type="password" id="haslo" name="haslo"><br>
            <ul style="font-size:x-small;">
                <li>
                    Co najmniej 8 znaków
                </li>
                <li>
                    Co najmniej jedna duża i mała litera
                </li>
                <li>
                    Co najmniej jedna cyfra
                </li>
            </ul>
        </td>
    </tr>
    <tr>
        <!-- UWAGI -->
        <td><label for="uwagi">Uwagi:</label></td>
        <td><textarea id="uwagi" name="uwagi" rows="5" cols="50"></textarea></td>
    </tr>
    <tr>
        <td colspan="2", style="font-size:x-small;">
            *pola wymagane
        </td>
    </tr>
    <tr>
        <td colspan="2" style="text-align: right;">
            <input type="button" id="wstawdane" value="Wstaw dane">
            <input type="reset" value="Reset">
            <input type="submit" value="Prześlij">
        </td>
    </tr>

</tbody>

</table></form></div>

</body>

</html>
